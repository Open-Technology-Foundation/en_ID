name: Test en_ID Locale

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck -x ./*.sh tests/*.sh

      - name: Locale file is UTF-8
        run: file localedata/en_ID | grep -E '(UTF-8|ASCII)'

      - name: No trailing whitespace
        run: '! git grep -nI "[[:space:]]$" -- . ":!*.md"'

      - name: No tabs in scripts or locale data
        run: '! git grep -nP "\t" -- "*.sh" localedata/'

  test:
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locale tools
        run: |
          sudo apt-get update
          sudo apt-get install -y locales

      - name: Test the build
        run: make test

      - name: Install system-wide
        run: sudo make install

      - name: Test the installed locale
        run: make test-installed

      - name: Test the build again, now that en_ID is installed
        run: make test

      - name: Uninstall
        run: sudo make uninstall

      - name: en_ID is gone
        run: '[[ $(locale -a) != *en_ID* ]]'

  install:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:13
          - fedora:latest
          - rockylinux/rockylinux:9
          - archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install, update packages, reinstall, uninstall
        env:
          EN_ID_TEST_DISPOSABLE: 1
        run: bash tests/test_install.sh
